name: V1 database migration recovery acceptance

on:
  pull_request:
    paths:
      - 'scripts/runTenantMigration.js'
      - 'scripts/runTenantMigration.v1DatabaseQuality.test.js'
      - '.github/workflows/v1-database-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run V1 tenant migration safety acceptance
        run: npx jest scripts/runTenantMigration.v1DatabaseQuality.test.js --runInBand

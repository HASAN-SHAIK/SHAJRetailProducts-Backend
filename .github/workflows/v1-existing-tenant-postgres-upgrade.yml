name: V1 existing tenant PostgreSQL upgrade

on:
  pull_request:
    paths:
      - 'Db/tenant_schema.sql'
      - 'Db/migrations/**'
      - 'scripts/runTenantMigration.js'
      - 'scripts/runTenantMigration.v1PostgresUpgrade.test.js'
      - 'src/services/tenantProvisionService.js'
      - '.github/workflows/v1-existing-tenant-postgres-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-tenant-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: existing_tenant_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d existing_tenant_v1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TEST_EXISTING_TENANT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/existing_tenant_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run V1 existing-tenant PostgreSQL upgrade acceptance
        run: npx jest scripts/runTenantMigration.v1PostgresUpgrade.test.js --runInBand

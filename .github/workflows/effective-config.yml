name: Retail control plane CI

on:
  push:
    branches: [main, agent/retail-settings-config]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test -- --runInBand tests/configuration.validation.test.js tests/configuration.pricingIsolation.test.js
      - run: npm test -- --runInBand tests/tenantUserController.test.js

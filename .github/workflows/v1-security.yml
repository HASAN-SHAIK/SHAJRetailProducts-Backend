name: V1 Security acceptance

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'src/App.js'
      - 'src/security/corsPolicy.js'
      - 'src/security/invoiceUploadPolicy.js'
      - 'src/config/rabbitmq.config.js'
      - 'src/middleware/authRateLimits.js'
      - 'src/routes/authRoutes.js'
      - 'src/routes/purchaseInvoiceRoutes.js'
      - 'src/api/v1/modules/auth/auth.routes.js'
      - 'src/services/imports.service.js'
      - 'tests/v1SecurityCorsPolicy.test.js'
      - 'tests/v1SecurityAuthRateLimits.test.js'
      - 'tests/v1SecurityImportBoundary.test.js'
      - 'tests/v1SecurityInvoiceUploadPolicy.test.js'
      - 'tests/v1SecurityRabbitmqConfig.test.js'
      - 'tests/v1SecurityDynamicSqlInventory.test.js'
      - 'tests/v1AuthCookieSecretHardening.test.js'
      - 'tests/v1CrossTenantAuthIsolation.test.js'
      - '.github/workflows/v1-security.yml'
      - 'docs/V1_SECURITY_ACCEPTANCE_MATRIX.md'
  workflow_dispatch:

jobs:
  security-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Verify dependency tree
        run: npm ls --depth=0
      - name: Report high and critical dependency advisories
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const rows = Object.entries(report.vulnerabilities || {})
            .filter(([, item]) => item?.severity === 'high' || item?.severity === 'critical')
            .map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: Boolean(item.isDirect),
              range: item.range,
              via: (item.via || []).map((v) => typeof v === 'string' ? v : `${v.name}:${v.severity}`).slice(0, 8),
              fixAvailable: item.fixAvailable
            }))
            .sort((a, b) => Number(b.direct) - Number(a.direct) || a.severity.localeCompare(b.severity) || a.name.localeCompare(b.name));
          console.log(JSON.stringify({ metadata: report.metadata?.vulnerabilities || {}, highCritical: rows }, null, 2));
          NODE
      - name: Run V1 Security acceptance
        run: >-
          npx jest
          tests/v1SecurityCorsPolicy.test.js
          tests/v1SecurityAuthRateLimits.test.js
          tests/v1SecurityImportBoundary.test.js
          tests/v1SecurityInvoiceUploadPolicy.test.js
          tests/v1SecurityRabbitmqConfig.test.js
          tests/v1SecurityDynamicSqlInventory.test.js
          tests/v1AuthCookieSecretHardening.test.js
          tests/v1CrossTenantAuthIsolation.test.js
          --runInBand

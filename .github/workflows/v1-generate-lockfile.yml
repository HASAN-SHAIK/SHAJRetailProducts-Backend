name: V1 generate Backend lockfile

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'package.json'
      - '.github/workflows/v1-generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'v1/security-backend-lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/security-backend-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate lockfile from current manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Generate Backend package lockfile'
          git push origin HEAD:v1/security-backend-lockfile

name: V1 customers outstanding PostgreSQL

on:
  pull_request:
    paths:
      - 'Db/migrations/2026-08-15-customer-outstanding-projection.sql'
      - 'src/modules/customers/customerOutstanding.postgresAcceptance.test.js'
      - '.github/workflows/v1-customers-outstanding-postgres.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers_outstanding_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customers_outstanding_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/customers_outstanding_e2e
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Certify deterministic customer outstanding projection
        run: npx jest src/modules/customers/customerOutstanding.postgresAcceptance.test.js --runInBand

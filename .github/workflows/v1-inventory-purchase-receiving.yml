name: V1 inventory purchase receiving

on:
  pull_request:
    paths:
      - 'src/services/purchaseService.js'
      - 'src/services/stockAuditService.js'
      - 'src/services/purchaseService.v1InventoryAcceptance.test.js'
      - '.github/workflows/v1-inventory-purchase-receiving.yml'

jobs:
  purchase-receiving-acceptance:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run purchase receiving inventory acceptance
        run: npx jest src/services/purchaseService.v1InventoryAcceptance.test.js --runInBand

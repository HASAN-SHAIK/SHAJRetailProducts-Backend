name: V1 Backend legacy returns unauthorized runtime Cycle A

on:
  push:
    branches:
      - test/v1-legacy-returns-unauthorized-runtime-cycle-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shaj
          POSTGRES_PASSWORD: shaj
          POSTGRES_DB: shaj_cycle_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shaj -d shaj_cycle_a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ENVIRONMENT: test
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      APP_PORT: '43127'
      DATABASE_URL: postgresql://shaj:shaj@127.0.0.1:5432/shaj_cycle_a
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert exact source head
        run: |
          set -euo pipefail
          echo "RETURNS_EXPECTED_HEAD=${GITHUB_SHA}"
          echo "RETURNS_ACTUAL_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused legacy returns permission tests
        run: npx jest tests/v1LegacyReturnPermissions.test.js --runInBand
      - name: Start real Express listener and verify fail-closed return history boundary
        run: |
          set -euo pipefail
          node -e "const app=require('./src/App'); const server=app.listen(Number(process.env.APP_PORT),'127.0.0.1',()=>console.log('RETURNS_SERVER_LISTENING='+process.env.APP_PORT)); const stop=()=>server.close(()=>process.exit(0)); process.on('SIGTERM',stop); process.on('SIGINT',stop);" > /tmp/returns-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=''
          for attempt in $(seq 1 30); do
            READY=$(curl -sS -o /tmp/returns-ready.json -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/health" || true)
            if [ "$READY" = '200' ]; then break; fi
            sleep 1
          done
          test "$READY" = '200'
          RETURNS_STATUS=$(curl -sS -D /tmp/returns.headers -o /tmp/returns.body -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/api/returns" || true)
          AFTER_STATUS=$(curl -sS -o /tmp/returns-after.json -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/health" || true)
          REQUEST_ID=$(awk 'BEGIN{IGNORECASE=1} /^x-request-id:/ {gsub("\r",""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/returns.headers)
          echo '--- server log ---'
          cat /tmp/returns-server.log
          echo '--- returns response ---'
          cat /tmp/returns.body
          echo
          echo "RETURNS_UNAUTH_STATUS=$RETURNS_STATUS"
          echo "RETURNS_REQUEST_ID_PRESENT=$([ -n "$REQUEST_ID" ] && echo true || echo false)"
          echo "RETURNS_PROCESS_ALIVE=$(kill -0 "$SERVER_PID" 2>/dev/null && echo true || echo false)"
          echo "RETURNS_HEALTH_AFTER_STATUS=$AFTER_STATUS"
          test "$RETURNS_STATUS" = '401'
          test -n "$REQUEST_ID"
          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/returns.body','utf8')); if(body.code!=='UNAUTHORIZED'||body.message!=='Unauthorized') throw new Error('unexpected response '+JSON.stringify(body)); console.log('RETURNS_UNAUTH_CODE='+body.code);"
          kill -0 "$SERVER_PID"
          test "$AFTER_STATUS" = '200'
          echo 'RETURNS_RUNTIME_PASS=true'
      - name: Run complete Backend suite
        run: npm test -- --runInBand

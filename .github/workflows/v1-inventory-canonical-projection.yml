name: V1 inventory canonical projection

on:
  pull_request:
    paths:
      - 'Db/migrations/2026-08-13-pos-inventory-canonical-application.sql'
      - 'Db/migrations/2026-08-14-pos-inventory-batch-allocations.sql'
      - 'Db/migrations/2026-08-14-pos-inventory-reconciliation-provenance.sql'
      - 'src/api/v1/modules/sync/inventoryMovementRecorded.processor.js'
      - 'src/api/v1/modules/sync/inventoryMovementRecorded.processor.test.js'
      - 'src/api/v1/modules/sync/posInventoryBatchAllocator.js'
      - 'src/api/v1/modules/sync/posInventoryBatchAllocator.test.js'
      - 'src/api/v1/modules/sync/posInventoryDeviceContext.js'
      - 'src/api/v1/modules/sync/posInventoryDeviceContext.test.js'
      - 'src/api/v1/modules/sync/posSync.routes.js'
      - 'src/api/v1/modules/sync/posEvent.processor.js'
      - 'src/controllers/inventoryReconciliationController.js'
      - 'src/routes/platform.routes.js'
      - 'src/services/inventoryReconciliationService.js'
      - 'src/services/inventoryReconciliationService.test.js'
      - '.github/workflows/v1-inventory-canonical-projection.yml'

jobs:
  focused-inventory-projection:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run canonical inventory projection tests
        run: npx jest src/api/v1/modules/sync/inventoryMovementRecorded.processor.test.js --runInBand
      - name: Run Central POS batch allocation tests
        run: npx jest src/api/v1/modules/sync/posInventoryBatchAllocator.test.js --runInBand
      - name: Run trusted inventory device authority tests
        run: npx jest src/api/v1/modules/sync/posInventoryDeviceContext.test.js --runInBand
      - name: Run support inventory reconciliation tests
        run: npx jest src/services/inventoryReconciliationService.test.js --runInBand

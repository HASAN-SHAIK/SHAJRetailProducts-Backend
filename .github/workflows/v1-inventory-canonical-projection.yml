name: V1 inventory canonical projection

on:
  pull_request:
    paths:
      - 'Db/migrations/2026-08-13-pos-inventory-canonical-application.sql'
      - 'src/api/v1/modules/sync/inventoryMovementRecorded.processor.js'
      - 'src/api/v1/modules/sync/inventoryMovementRecorded.processor.test.js'
      - '.github/workflows/v1-inventory-canonical-projection.yml'

jobs:
  focused-inventory-projection:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run canonical inventory projection tests
        run: npx jest src/api/v1/modules/sync/inventoryMovementRecorded.processor.test.js --runInBand

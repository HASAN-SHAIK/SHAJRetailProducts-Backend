name: V1 Authentication Authorization acceptance

on:
  pull_request:
    paths:
      - 'src/middleware/authTenant.js'
      - 'src/middleware/authTenant.v1Acceptance.test.js'
      - 'src/middleware/authAdmin.js'
      - 'src/middleware/requirePermission.js'
      - 'src/routes/authRoutes.js'
      - 'src/routes/orderRoutes.js'
      - 'src/routes/productRoutes.js'
      - 'src/routes/stockRoutes.js'
      - 'src/modules/customers/routes.js'
      - 'src/api/v1/modules/auth/auth.routes.js'
      - 'src/controllers/tenant/userController.js'
      - 'src/controllers/authController.js'
      - 'src/controllers/adminAuthController.js'
      - 'src/services/authSessionService.js'
      - 'src/utils/jwt.js'
      - 'src/utils/rolePermissions.js'
      - 'tests/tenantUserController.test.js'
      - 'tests/v1AuthRefreshPostgres.test.js'
      - 'tests/v1PlatformAdminAuth.test.js'
      - 'tests/v1PublicRegistrationBoundary.test.js'
      - 'tests/v1ProtectedRoutePermissions.test.js'
      - 'Db/migrations/2026-08-16-v1-auth-tenant-roles.sql'
      - 'src/services/tenantProvisionService.js'
      - 'src/controllers/offlineGrantController.js'
      - 'src/controllers/offlineGrantController.test.js'
      - '.github/workflows/v1-auth.yml'
      - 'docs/V1_AUTHORIZATION_ACCEPTANCE_MATRIX.md'
  workflow_dispatch:

jobs:
  auth-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v1_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v1_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V1_AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/v1_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run V1 auth acceptance
        run: >-
          npx jest
          src/middleware/authTenant.v1Acceptance.test.js
          tests/tenantUserController.test.js
          src/utils/rolePermissions.test.js
          src/controllers/offlineGrantController.test.js
          tests/v1AuthRefreshPostgres.test.js
          tests/v1PlatformAdminAuth.test.js
          tests/v1PublicRegistrationBoundary.test.js
          tests/v1ProtectedRoutePermissions.test.js
          --runInBand

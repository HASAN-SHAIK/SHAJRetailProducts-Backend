name: V1 fresh tenant PostgreSQL acceptance

on:
  pull_request:
    paths:
      - 'Db/tenant_schema.sql'
      - 'Db/migrations/**'
      - 'src/services/tenantProvisionService.js'
      - 'src/services/tenantProvisionService.v1Postgres.test.js'
      - '.github/workflows/v1-fresh-tenant-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-tenant-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fresh_tenant_v1
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fresh_tenant_v1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TEST_FRESH_TENANT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fresh_tenant_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run V1 fresh tenant PostgreSQL acceptance
        run: npx jest src/services/tenantProvisionService.v1Postgres.test.js --runInBand

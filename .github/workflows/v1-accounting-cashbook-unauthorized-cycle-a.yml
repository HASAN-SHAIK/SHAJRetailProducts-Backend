name: V1 Backend accounting cashbook unauthorized Cycle A

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      APP_ENVIRONMENT: test
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      APP_PORT: '43131'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused accounting authorization test
        run: npx jest tests/v1AccountingCashbookUnauthorized.test.js --runInBand
      - name: Start real Express listener and verify unauthenticated cash-book read fails closed
        run: |
          set -euo pipefail
          node -e "const app=require('./src/App'); const server=app.listen(Number(process.env.APP_PORT),'127.0.0.1',()=>console.log('ACCOUNTING_CASHBOOK_SERVER_LISTENING='+process.env.APP_PORT)); const stop=()=>server.close(()=>process.exit(0)); process.on('SIGTERM',stop); process.on('SIGINT',stop);" > /tmp/accounting-cashbook-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=''
          for attempt in $(seq 1 30); do READY=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/health" || true); [ "$READY" = '200' ] && break; sleep 1; done
          test "$READY" = '200'
          STATUS=$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/api/accounts/cash-book" || true)
          AFTER=$(curl -sS -o /tmp/after.json -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/health" || true)
          REQUEST_ID=$(awk 'BEGIN{IGNORECASE=1} /^x-request-id:/ {gsub("\r",""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' /tmp/headers)
          cat /tmp/accounting-cashbook-server.log; cat /tmp/body; echo
          test "$STATUS" = '401'; test -n "$REQUEST_ID"; kill -0 "$SERVER_PID"; test "$AFTER" = '200'
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/body','utf8')); if(b.code!=='UNAUTHORIZED'||b.message!=='Unauthorized') process.exit(1)"
          echo 'ACCOUNTING_CASHBOOK_RUNTIME_PASS=true'
      - name: Run complete Backend suite
        run: npm test -- --runInBand
